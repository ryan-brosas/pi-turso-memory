name: Publish npm package

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # npm trusted publishing requires npm >= 11.5.1 and Node >= 22.14.
      - run: npm install --global npm@^11.5.1
      - run: npm ci
      - name: Require the tag to match package.json
        run: |
          test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      # prepublishOnly runs the full typecheck, test suite, and tarball inspection.
      # Prerelease versions (e.g. 0.2.0-alpha.0) publish under their own dist-tag
      # (alpha/beta/rc) so latest is never replaced by an unstable build.
      - name: Publish with version-derived dist-tag
        run: |
          TAG="latest"
          VERSION="$(jq -r .version package.json)"
          case "$VERSION" in
            *-*) TAG="${VERSION#*-}"; TAG="${TAG%%.*}" ;;
          esac
          echo "Publishing $VERSION under dist-tag $TAG"
          npm publish --provenance --access public --tag "$TAG"
